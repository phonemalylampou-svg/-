                                <div className="flex gap-2">
                                    {['time_m', 'time_a', 'time_e'].map((timeKey) => (
                                        <button key={timeKey} onClick={() => setNewLog({...newLog, time: timeKey})} className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all border ${newLog.time === timeKey ? 'bg-rose-500 text-white border-rose-500 shadow-md transform scale-[1.02]' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'}`}>
                                            {t(timeKey)}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-500 mb-1">{t('track_note')}</label>
                                <input type="text" placeholder={t('track_note_ph')} value={newLog.conflict} onChange={(e) => setNewLog({...newLog, conflict: e.target.value})} className="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-rose-500 outline-none transition-all bg-gray-50 hover:bg-white" />
                            </div>
                            <button onClick={handleSaveLog} className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl mt-4 flex items-center justify-center gap-2 transition-all shadow-md hover:shadow-lg active:scale-95">
                                <Icon name="Save" size={20} /> {t('track_save')}
                            </button>
                        </div>
                    </div>

                    <div>
                        <h3 className="font-bold text-gray-700 mb-3 pl-1">{t('track_hist')}</h3>
                        {logs.length === 0 ? (
                            <div className="bg-gray-50 border border-dashed border-gray-300 rounded-2xl p-6 text-center">
                                <p className="text-sm text-gray-400">{t('track_empty')}</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {logs.map((log) => (
                                    <div key={log.id} className="bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-1 hover:border-rose-200 transition-colors">
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-gray-800">{log.date}</span>
                                            <span className="text-xs bg-rose-100 text-rose-800 px-3 py-1 rounded-full font-bold">{t(log.time)}</span>
                                        </div>
                                        <div className="text-[13px] text-gray-600 flex items-start gap-1.5 mt-1">
                                            <Icon name="Coffee" size={16} className="mt-0.5 text-gray-400 flex-shrink-0" />
                                            <span>{log.conflict || <span className="italic text-gray-400">{t('track_no_conflict')}</span>}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ReportSection({ t, tabViews, likes }) {
            const totalViews = Object.values(tabViews).reduce((a, b) => a + b, 0);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="text-center mb-2">
                        <h2 className="text-xl font-bold text-gray-800 text-rose-600">{t('rep_title')}</h2>
                        <p className="text-sm text-gray-500">{t('rep_sub')}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-gradient-to-br from-rose-400 to-rose-600 p-5 rounded-2xl shadow-md text-white flex flex-col items-center justify-center transform transition-transform hover:scale-105">
                            <Icon name="ThumbsUp" size={32} className="mb-2 opacity-90" />
                            <p className="text-3xl font-bold">{likes}</p>
                            <p className="text-xs font-medium opacity-90 text-center mt-1">{t('rep_likes')}</p>
                        </div>
                        
                        <div className="bg-gradient-to-br from-blue-400 to-blue-600 p-5 rounded-2xl shadow-md text-white flex flex-col items-center justify-center transform transition-transform hover:scale-105">
                            <Icon name="Activity" size={32} className="mb-2 opacity-90" />
                            <p className="text-3xl font-bold">{totalViews}</p>
                            <p className="text-xs font-medium opacity-90 text-center mt-1">{t('rep_views')}</p>
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <h3 className="font-bold text-gray-700 mb-5 border-b pb-2">{t('rep_stat')}</h3>
                        <div className="space-y-5">
                            <StatRow icon={<Icon name="Info" size={20} className="text-blue-500" />} label={t('tab_info')} count={tabViews.info} total={totalViews} color="bg-blue-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="Apple" size={20} className="text-green-500" />} label={t('tab_food')} count={tabViews.food} total={totalViews} color="bg-green-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="Pill" size={20} className="text-rose-500" />} label={t('tab_meds')} count={tabViews.meds} total={totalViews} color="bg-rose-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="CalendarCheck" size={20} className="text-orange-500" />} label={t('tab_tracker')} count={tabViews.tracker} total={totalViews} color="bg-orange-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="BarChart3" size={20} className="text-purple-500" />} label={t('tab_report')} count={tabViews.report} total={totalViews} color="bg-purple-500" suffix={t('rep_times')} />
                            <StatRow icon={<Icon name="MessageSquare" size={20} className="text-teal-500" />} label={t('tab_qna')} count={tabViews.qna} total={totalViews} color="bg-teal-500" suffix={t('rep_times')} />
                        </div>
                    </div>
                </div>
            );
        }

        function StatRow({ icon, label, count, total, color, suffix }) {
            const percentage = total === 0 ? 0 : Math.round((count / total) * 100);
            return (
                <div>
                    <div className="flex justify-between items-center mb-1.5">
                        <div className="flex items-center gap-2.5">
                            {icon}
                            <span className="text-[13px] font-bold text-gray-700">{label}</span>
                        </div>
                        <span className="text-[13px] font-bold text-gray-800 bg-gray-100 px-2 py-0.5 rounded-md">{count} {suffix}</span>
                    </div>
                    <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                        <div className={`${color} h-2 rounded-full transition-all duration-1000 ease-out`} style={{ width: `${percentage}%` }}></div>
                    </div>
                </div>
            );
        }

        function QnaSection({ t }) {
            const [feedback, setFeedback] = useState('');

            const handleSubmitFeedback = () => {
                if (feedback.trim() === '') return;
                alert(t('fb_alert'));
                setFeedback('');
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    
                    {/* FAQ Section */}
                    <div>
                        <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2 mb-4">
                            <Icon name="HelpCircle" size={20} className="text-teal-500" /> {t('faq_title')}
                        </h2>
                        
                        <div className="space-y-3">
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <h3 className="font-bold text-gray-800 text-[13px] mb-1.5 flex items-start gap-2">
                                    <span className="text-teal-500 font-black">Q:</span> {t('faq_1_q')}
                                </h3>
                                <p className="text-[13px] text-gray-600 pl-6 leading-relaxed">
                                    <span className="text-rose-500 font-bold">A:</span> {t('faq_1_a')}
                                </p>
                            </div>
                            
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <h3 className="font-bold text-gray-800 text-[13px] mb-1.5 flex items-start gap-2">
                                    <span className="text-teal-500 font-black">Q:</span> {t('faq_2_q')}
                                </h3>
                                <p className="text-[13px] text-gray-600 pl-6 leading-relaxed">
                                    <span className="text-rose-500 font-bold">A:</span> {t('faq_2_a')}
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* Feedback Section */}
                    <div className="bg-gradient-to-b from-teal-50 to-white p-4 rounded-2xl border border-teal-100 shadow-sm">
                        <h2 className="font-bold text-teal-800 mb-3 flex items-center gap-2">
                            <Icon name="MessageSquare" size={20} /> {t('fb_title')}
                        </h2>
                        <textarea
                            value={feedback}
                            onChange={(e) => setFeedback(e.target.value)}
                            placeholder={t('fb_ph')}
                            className="w-full h-24 p-3 rounded-xl border border-teal-200 text-sm focus:ring-2 focus:ring-teal-400 outline-none resize-none mb-3 bg-white"
                        />
                        <button 
                            onClick={handleSubmitFeedback}
                            className="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md active:scale-95"
                        >
                            <Icon name="Send" size={16} /> {t('fb_submit')}
                        </button>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
